name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # E11: xác nhận compileSdk = 36 và AGP >= 8.9.1 ngay trong log CI
      - name: Verify build toolchain (compileSdk / AGP)
        run: |
          set -e
          AGP=$(grep -E '^agp = ' gradle/libs.versions.toml | cut -d'"' -f2)
          SDK=$(grep -E '^\s*compileSdk = ' app/build.gradle.kts | tr -dc '0-9')
          echo "AGP=$AGP  compileSdk=$SDK"
          [ "$SDK" -ge 36 ] || { echo "::error::compileSdk ($SDK) < 36"; exit 1; }
          printf '%s\n%s\n' "8.9.1" "$AGP" | sort -V -C || { echo "::error::AGP ($AGP) < 8.9.1"; exit 1; }

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # E1: cổng chặn chuỗi hardcode trong UI Compose
      - name: Check hardcoded UI strings (E1)
        run: ./gradlew checkHardcodedStrings

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
